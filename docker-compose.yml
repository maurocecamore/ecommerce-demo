services:
  php:
    build: ./api-products
    volumes:
      - ./api-products/src:/var/www/html

  nginx:
    image: nginx
    volumes: 
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./api-products/src:/var/www/html
    depends_on: 
      - php

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
